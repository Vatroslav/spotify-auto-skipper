{% extends "base.html" %}
{% block title %}Logs - Spotify Auto-Skipper{% endblock %}
{% block content %}
<div class="container">
    <h1 class="page-title">Logs</h1>

    <div class="date-nav">
        <input type="date" id="log-date-picker" class="date-input" />
    </div>

    <div class="filter-chips">
        <button class="chip active" data-level="all">All</button>
        <button class="chip" data-level="info">Info</button>
        <button class="chip" data-level="warning">Warning</button>
        <button class="chip" data-level="error">Error</button>
        <button class="chip" data-level="skipped">Skipped</button>
        <button class="chip" data-level="kept">Kept</button>
    </div>

    <div class="card">
        <div class="card-header">
            <button id="copy-logs-btn" class="btn btn-sm">Copy</button>
        </div>
        <div id="logs-container" class="logs-scroll">
            <p class="text-muted text-center">Loading...</p>
        </div>
    </div>
</div>
{% endblock %}

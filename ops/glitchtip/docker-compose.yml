# GlitchTip — self-hosted error tracking for the skipper app.
#
# Deliberately a SEPARATE compose project from the app (hence `name:` below, and
# why this lives outside cloud/). Two reasons:
#   1. `/deploy` runs `docker compose up -d --build` against cloud/. If GlitchTip
#      were in that file, every app deploy would restart the very thing meant to
#      be watching the deploy.
#   2. cloud/docker-compose.yml carries a documented project-name/volume gotcha.
#      Not touching it at all is the safest option.
#
# The app reaches GlitchTip over the app's own network, which already exists as
# `skipper_default`. We attach to it as an external network with the alias
# `glitchtip`, so the app's DSN host is `glitchtip:8000` and cloud/docker-compose.yml
# needs no changes whatsoever.
#
# Browser access is loopback-only on purpose — no DNS record, no Caddy block, no
# public attack surface to lock down. Reach the UI through an SSH tunnel:
#   ssh -L 8001:127.0.0.1:8001 root@autoskipper.uk
#   then open http://localhost:8001
#
# Start:  docker compose --env-file .env up -d
name: glitchtip

x-environment: &default-environment
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  VALKEY_URL: redis://valkey:6379
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in ops/glitchtip/.env}
  # Must match how the UI is reached (the SSH tunnel above), or login links break.
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
  EMAIL_URL: consolemail://
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  ENABLE_ADMIN: "False"
  ENABLE_OPENAPI: "False"
  GLITCHTIP_ENABLE_MCP: "False"
  GLITCHTIP_ENABLE_DUCKDB: "False"
  # Off to keep the footprint small — this box also runs the app it watches
  # plus stashitforlater.com. Flip either to "True" if you want the feature.
  GLITCHTIP_ENABLE_LOGS: "False"
  GLITCHTIP_ENABLE_UPTIME: "False"
  # Flip to "False" once your account exists, so the signup form is closed.
  ENABLE_USER_REGISTRATION: "True"

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"  # not published; reachable only inside this project
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped

  web:
    image: glitchtip/glitchtip:6
    depends_on:
      - postgres
      - valkey
    ports:
      # Loopback only — see the SSH tunnel note above. Do NOT change to 0.0.0.0
      # without putting Caddy and authentication in front of it first.
      - "127.0.0.1:8001:8000"
    environment:
      <<: *default-environment
      SERVER_ROLE: all_in_one
    restart: unless-stopped
    volumes:
      - uploads:/code/uploads
    networks:
      default:
      skipper:
        aliases:
          - glitchtip

volumes:
  pg-data:
  uploads:

networks:
  default:
  # The app's existing network, created by cloud/docker-compose.yml (project
  # `skipper`). Must already exist — start the app before starting GlitchTip.
  skipper:
    external: true
    name: skipper_default
